<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas Stellaire</title>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- As a <link> (rather than a CSS @import), the HTML parser's pre-load
         scanner discovers and starts fetching this well before app.css is
         even injected by JS, giving the UI font the best possible head start
         before the 3D nav view might need to bake it into a canvas texture
         (see src/lib/utils/fonts.js and its use in NavMap3D.svelte). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Kode+Mono:wght@400..700&display=swap"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
